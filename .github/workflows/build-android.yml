name: Build Amethisty (Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    - master
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android arm64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure CMake
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Amethisty
        run: cmake --build build-android --target amethisty --parallel 2

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: amethisty-android-arm64
          path: build-android/libamethisty.so
          if-no-files-found: error
          retention-days: 14
