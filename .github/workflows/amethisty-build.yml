name: Amethisty Android - Manual Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "third_party/**"
      - "tests/**"
      - ".github/workflows/amethisty-build.yml"
permissions:
  contents: read
jobs:
  build:
    name: Build Amethisty Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CMake, Ninja and zlib headers
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev
      - name: Run native tests
        run: |
          cmake -S . -B build-host -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host --target amethisty_manifest_tests amethisty_package_tests amethisty_native_loader_tests --parallel 2
          ctest --test-dir build-host --output-on-failure
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-android --target amethisty --parallel 2
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: amethisty-android-arm64
          path: build-android/libamethisty.so
          if-no-files-found: error
          retention-days: 14
