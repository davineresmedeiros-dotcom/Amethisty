name: Build Amethisty APK (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Amethisty launcher APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Amethisty
        uses: actions/checkout@v4

      - name: Checkout Geode Android Launcher (pinned source)
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/android-launcher
          ref: 9e136f728d35bdd60b8e66f382e0d1e405376854
          path: launcher

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: launcher/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37"

      - name: Install CMake, Ninja and zlib headers
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Install Android NDKs
        run: sdkmanager "ndk;27.2.12479018" "ndk;30.0.16248370"

      - name: Configure Amethisty native library
        run: |
          cmake -S . -B build-amethisty -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Amethisty native library
        run: cmake --build build-amethisty --target amethisty --parallel 2

      - name: Prepare launcher source for Amethisty
        run: python3 scripts/prepare-apk.py --launcher-root launcher --native-lib build-amethisty/libamethisty.so

      - name: Build signed debug APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon app:assembleStandardDebug -PdisableAbiSplits

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethisty-2.2.145-arm64-debug-apk
          path: launcher/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
